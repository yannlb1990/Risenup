<g><rect x="559" y="158" width="298" height="125" rx="8" class="cell" stroke="#ded3c7"/><text x="584" y="194" class="label muted">SERVICE CONTRIBUTION</text><text x="584" y="241" class="value">62%</text><text x="584" y="267" class="small muted">After direct inputs</text></g>
