<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Illustrative preview of the Risenup clinic margin tracker workbook</title>
<desc id="desc">A clean, anonymised workbook-style dashboard showing example treatment revenue and contribution metrics, weekly trend bars, product margins and stock levels. All figures are illustrative. No client data or formulas are shown.</desc>
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#402a1d}.muted{fill:#8a796c}.tiny{font-size:13px;letter-spacing:1.7px}.small{font-size:16px}.body{font-size:18px}.label{font-size:14px;letter-spacing:1px}.value{font-family:Georgia,serif;font-size:30px}.title{font-family:Georgia,serif;font-size:35px}.white{fill:#f3eee4}.red{fill:#873c2d}.grid{stroke:#ded3c7;stroke-width:1}.row{fill:#f8f4ed}.cell{fill:#fffdf8}
</style></defs>
<rect width="1600" height="1000" rx="18" fill="#e9dfd2"/><rect x="16" y="16" width="1568" height="968" rx="12" fill="#f6f2ea" stroke="#d7c8ba" stroke-width="2"/>
<rect x="16" y="16" width="188" height="968" rx="12" fill="#402a1d"/><path d="M192 16h12v968h-12z" fill="#402a1d"/>
<text x="48" y="72" class="white" font-family="Georgia,serif" font-size="27" letter-spacing="4">RISENUP</text><text x="48" y="129" class="white tiny">CLINIC TRACKER</text>
<rect x="37" y="159" width="145" height="42" rx="5" fill="#754434"/><text x="54" y="186" class="white small">Overview</text>
<text x="54" y="245" class="white small" opacity=".8">Daily sales</text><text x="54" y="294" class="white small" opacity=".8">Treatments</text><text x="54" y="343" class="white small" opacity=".8">Products &amp; stock</text><text x="54" y="392" class="white small" opacity=".8">Operating costs</text><text x="54" y="441" class="white small" opacity=".8">Marketing</text><text x="54" y="490" class="white small" opacity=".8">Monthly review</text>
<text x="54" y="926" class="white tiny" opacity=".7">EXAMPLE LAYOUT</text>
<text x="246" y="73" class="tiny red">WORKBOOK PREVIEW · ILLUSTRATIVE FIGURES</text><text x="246" y="125" class="title">A clearer view of the work behind each service.</text>
<rect x="1300" y="46" width="236" height="40" rx="20" fill="#eee4d9"/><text x="1324" y="72" class="tiny red">EXAMPLE DATA ONLY</text>
